<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>开心消消乐</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0533">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="开心消消乐">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #1a0533 0%, #2d1b69 40%, #1a0533 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            color: #fff; overflow: hidden; touch-action: none;
        }

        .game-wrap {
            position: relative; z-index: 1; width: 420px; max-width: 98vw;
            background: linear-gradient(180deg, rgba(45,27,105,0.9), rgba(26,5,51,0.95));
            border-radius: 20px; padding: 16px;
            border: 2px solid rgba(255,180,255,0.15);
            box-shadow: 0 0 60px rgba(160,80,255,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: visible;
        }

        /* 顶部信息栏 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 8px 12px;
            background: rgba(0,0,0,0.3); border-radius: 12px;
        }
        .top-bar .label { font-size: 11px; color: rgba(255,180,255,0.5); text-transform: uppercase; letter-spacing: 1px; }
        .top-bar .value { font-size: 20px; font-weight: 700; color: #ffb4ff; }
        .top-bar .item { text-align: center; }

        /* 目标进度条 */
        .target-bar { margin-bottom: 12px; }
        .target-track {
            height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden;
            border: 1px solid rgba(255,180,255,0.1);
        }
        .target-fill {
            height: 100%; border-radius: 5px; transition: width 0.4s ease;
            background: linear-gradient(90deg, #ff6b9d, #c44dff, #6b5bff);
        }
        .target-text {
            font-size: 12px; color: rgba(255,180,255,0.6); margin-bottom: 4px;
            display: flex; justify-content: space-between;
        }

        /* 棋盘 */
        .board-container {
            position: relative; margin: 0 auto;
            background: rgba(0,0,0,0.35); border-radius: 14px; padding: 6px;
            border: 1px solid rgba(255,180,255,0.08);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        .board {
            display: grid; gap: 3px; position: relative;
        }

        /* 格子 */
        .cell {
            border-radius: 8px; position: relative; cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        .cell::after {
            content: ''; position: absolute; top: 2px; left: 15%; right: 15%; height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
            border-radius: 50%; pointer-events: none;
        }
        .cell:active { transform: scale(0.92); }

        /* 6种宝石颜色 */
        .gem-0 { background: linear-gradient(145deg, #ff4d6d, #c9184a); box-shadow: 0 3px 8px rgba(255,77,109,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); }
        .gem-1 { background: linear-gradient(145deg, #ffd166, #f4a261); box-shadow: 0 3px 8px rgba(255,209,102,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); }
        .gem-2 { background: linear-gradient(145deg, #06d6a0, #1b9aaa); box-shadow: 0 3px 8px rgba(6,214,160,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); }
        .gem-3 { background: linear-gradient(145deg, #4cc9f0, #4361ee); box-shadow: 0 3px 8px rgba(76,201,240,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); }
        .gem-4 { background: linear-gradient(145deg, #b5179e, #7209b7); box-shadow: 0 3px 8px rgba(181,23,158,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); }
        .gem-5 { background: linear-gradient(145deg, #ff8fab, #ff6b6b); box-shadow: 0 3px 8px rgba(255,143,171,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); }

        /* 宝石内部图案 */
        .cell .gem-icon { font-size: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); position: relative; z-index: 1; }

        /* 选中状态 */
        .cell.selected {
            transform: scale(1.12); z-index: 10;
            box-shadow: 0 0 20px rgba(255,180,255,0.6), 0 0 40px rgba(255,180,255,0.3) !important;
            animation: selectedPulse 0.6s ease infinite alternate;
        }
        @keyframes selectedPulse {
            from { box-shadow: 0 0 15px rgba(255,180,255,0.5), 0 0 30px rgba(255,180,255,0.2); }
            to { box-shadow: 0 0 25px rgba(255,180,255,0.8), 0 0 50px rgba(255,180,255,0.4); }
        }

        /* 消除动画 */
        .cell.removing {
            animation: removeAnim 0.35s ease forwards;
        }
        @keyframes removeAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* 下落动画 */
        .cell.dropping {
            animation: dropAnim 0.3s ease;
        }
        @keyframes dropAnim {
            from { transform: translateY(-40px); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 交换动画 */
        .cell.swap-left { animation: swapL 0.2s ease; }
        .cell.swap-right { animation: swapR 0.2s ease; }
        .cell.swap-up { animation: swapU 0.2s ease; }
        .cell.swap-down { animation: swapD 0.2s ease; }
        @keyframes swapL { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes swapR { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes swapU { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes swapD { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        /* 连击特效 */
        .combo-text {
            position: fixed; font-size: 32px; font-weight: 900; color: #ffb4ff;
            text-shadow: 0 0 20px rgba(255,180,255,0.8); pointer-events: none; z-index: 100;
            animation: comboFloat 0.8s ease forwards;
        }
        @keyframes comboFloat {
            0% { transform: scale(0.5) translateY(0); opacity: 0; }
            30% { transform: scale(1.3) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(-60px); opacity: 0; }
        }

        /* 粒子爆炸 */
        .particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            pointer-events: none; z-index: 50;
            animation: particleFly 0.5s ease forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* 底部按钮 */
        .bottom-bar {
            display: flex; gap: 8px; margin-top: 12px;
        }
        .bottom-btn {
            flex: 1; padding: 10px 0; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            letter-spacing: 1px;
        }
        .btn-restart { background: linear-gradient(135deg, #c44dff, #6b5bff); color: #fff; }
        .btn-restart:hover { box-shadow: 0 4px 15px rgba(196,77,255,0.4); transform: translateY(-2px); }
        .btn-shuffle { background: rgba(255,180,255,0.12); color: #ffb4ff; border: 1px solid rgba(255,180,255,0.2); }
        .btn-shuffle:hover { background: rgba(255,180,255,0.2); transform: translateY(-2px); }

        /* 遮罩 */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            display: flex; justify-content: center; align-items: center;
        }
        .overlay-box {
            background: linear-gradient(180deg, rgba(45,27,105,0.98), rgba(26,5,51,0.98));
            border-radius: 20px; padding: 36px; text-align: center; max-width: 360px; width: 90vw;
            border: 1px solid rgba(255,180,255,0.2);
            box-shadow: 0 0 60px rgba(160,80,255,0.2);
        }
        .overlay-title {
            font-size: 28px; font-weight: 700; margin-bottom: 12px;
            background: linear-gradient(135deg, #ffb4ff, #c44dff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .overlay-text { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
        .overlay-score { font-size: 42px; font-weight: 900; color: #ffb4ff; margin: 12px 0; }
        .overlay-btn {
            padding: 12px 32px; border: none; border-radius: 10px; font-size: 16px;
            font-weight: 600; cursor: pointer; margin: 6px; transition: all 0.2s;
        }
        .overlay-btn-primary { background: linear-gradient(135deg, #c44dff, #6b5bff); color: #fff; }
        .overlay-btn-primary:hover { box-shadow: 0 4px 15px rgba(196,77,255,0.4); transform: translateY(-2px); }

        /* 关卡选择 */
        .level-select { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
        .level-btn {
            width: 48px; height: 48px; border-radius: 12px; border: 2px solid rgba(255,180,255,0.2);
            background: rgba(255,180,255,0.08); color: #ffb4ff; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .level-btn:hover { background: rgba(255,180,255,0.2); transform: scale(1.1); }
        .level-btn.locked { opacity: 0.3; cursor: not-allowed; }
        .level-btn.current { border-color: #c44dff; background: rgba(196,77,255,0.2); box-shadow: 0 0 12px rgba(196,77,255,0.3); }

        @media (max-width: 440px) {
            .game-wrap { padding: 10px; }
            .cell .gem-icon { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="game-wrap" id="gameWrap">
        <!-- 测试码入口 -->
        <div style="position:absolute;top:6px;right:6px;z-index:20;">
            <div id="testCodeArea" style="display:none;position:absolute;top:36px;right:0;background:rgba(0,0,0,0.95);border-radius:12px;padding:12px;border:1px solid rgba(255,180,255,0.25);width:190px;box-shadow:0 4px 20px rgba(0,0,0,0.5);">
                <div style="font-size:11px;color:rgba(255,180,255,0.5);margin-bottom:8px;">输入测试码</div>
                <div style="display:flex;gap:4px;">
                    <div id="testCodeInput" style="flex:1;padding:8px 10px;background:rgba(255,180,255,0.1);border:1px solid rgba(255,180,255,0.2);border-radius:6px;color:#ffb4ff;font-size:16px;font-family:monospace;min-height:32px;letter-spacing:4px;display:flex;align-items:center;justify-content:center;"></div>
                    <button onclick="submitTestCode()" style="padding:8px 12px;background:linear-gradient(135deg,#c44dff,#6b5bff);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;">确认</button>
                </div>
                <div style="display:flex;gap:6px;margin-top:8px;justify-content:center;">
                    <button onclick="appendTestDigit('1')" style="width:40px;height:34px;background:rgba(255,180,255,0.12);border:1px solid rgba(255,180,255,0.2);border-radius:6px;color:#ffb4ff;cursor:pointer;font-size:18px;font-weight:600;">1</button>
                    <button onclick="appendTestDigit('2')" style="width:40px;height:34px;background:rgba(255,180,255,0.12);border:1px solid rgba(255,180,255,0.2);border-radius:6px;color:#ffb4ff;cursor:pointer;font-size:18px;font-weight:600;">2</button>
                    <button onclick="appendTestBackspace()" style="width:40px;height:34px;background:rgba(255,100,100,0.15);border:1px solid rgba(255,100,100,0.25);border-radius:6px;color:#ff6464;cursor:pointer;font-size:14px;">⌫</button>
                </div>
            </div>
            <button onclick="toggleTestCode()" style="width:32px;height:32px;background:rgba(255,180,255,0.15);border:1px solid rgba(255,180,255,0.25);border-radius:8px;color:rgba(255,180,255,0.6);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;">⚙</button>
        </div>

        <div class="top-bar">
            <div class="item"><div class="label">关卡</div><div class="value" id="levelNum">1</div></div>
            <div class="item"><div class="label">分数</div><div class="value" id="scoreNum">0</div></div>
            <div class="item"><div class="label">步数</div><div class="value" id="movesNum">30</div></div>
            <div class="item"><div class="label">连击</div><div class="value" id="comboNum">0</div></div>
        </div>

        <div class="target-bar">
            <div class="target-text">
                <span id="targetLabel">目标: 2000</span>
                <span id="targetPct">0%</span>
            </div>
            <div class="target-track"><div class="target-fill" id="targetFill" style="width:0%"></div></div>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>

        <div class="bottom-bar">
            <button class="bottom-btn btn-shuffle" onclick="shuffleBoard()">洗牌</button>
            <button class="bottom-btn btn-restart" onclick="restartLevel()">重玩</button>
        </div>
    </div>

    <script>
    // ========== 常量 ==========
    const ROWS = 8, COLS = 8, GEM_TYPES = 6;
    const GEM_ICONS = ['💎', '⭐', '🍀', '🔮', '💜', '🌸'];
    const GEM_COLORS = ['#ff4d6d','#ffd166','#06d6a0','#4cc9f0','#b5179e','#ff8fab'];

    // 关卡配置: { target, moves }
    const LEVELS = [];
    for (let i = 1; i <= 20; i++) {
        LEVELS.push({ target: 1000 + i * 500, moves: Math.max(15, 35 - i) });
    }

    // ========== 游戏状态 ==========
    let board = [];         // board[r][c] = gem type (0-5) or -1
    let score = 0;
    let moves = 0;
    let combo = 0;
    let level = 0;
    let selected = null;    // {r, c} or null
    let animating = false;
    let maxLevel = parseInt(localStorage.getItem('match3_max') || '1');
    let testMode = false;

    // ========== 棋盘逻辑 ==========
    function initBoard() {
        board = [];
        for (let r = 0; r < ROWS; r++) {
            board[r] = [];
            for (let c = 0; c < COLS; c++) {
                // 避免初始就有3连
                let gem;
                do {
                    gem = Math.floor(Math.random() * GEM_TYPES);
                } while (
                    (c >= 2 && board[r][c-1] === gem && board[r][c-2] === gem) ||
                    (r >= 2 && board[r-1][c] === gem && board[r-2][c] === gem)
                );
                board[r][c] = gem;
            }
        }
    }

    function findMatches() {
        const matched = new Set();
        // 横向
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                if (board[r][c] >= 0 && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                    let k = c;
                    while (k < COLS && board[r][k] === board[r][c]) { matched.add(r * COLS + k); k++; }
                }
            }
        }
        // 纵向
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                if (board[r][c] >= 0 && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                    let k = r;
                    while (k < ROWS && board[k][c] === board[r][c]) { matched.add(k * COLS + c); k++; }
                }
            }
        }
        return matched;
    }

    function removeMatches(matched) {
        const cells = [];
        matched.forEach(idx => {
            const r = Math.floor(idx / COLS), c = idx % COLS;
            board[r][c] = -1;
            cells.push({r, c});
        });
        return cells;
    }

    function dropGems() {
        const drops = []; // {c, fromR, toR}
        for (let c = 0; c < COLS; c++) {
            let writeR = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] >= 0) {
                    if (r !== writeR) {
                        board[writeR][c] = board[r][c];
                        board[r][c] = -1;
                        drops.push({c, fromR: r, toR: writeR});
                    }
                    writeR--;
                }
            }
            // 填充顶部空位
            for (let r = writeR; r >= 0; r--) {
                board[r][c] = Math.floor(Math.random() * GEM_TYPES);
                drops.push({c, fromR: r - (writeR - r + 1), toR: r, isNew: true});
            }
        }
        return drops;
    }

    function swap(r1, c1, r2, c2) {
        const tmp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = tmp;
    }

    function isAdjacent(r1, c1, r2, c2) {
        return (Math.abs(r1-r2) + Math.abs(c1-c2)) === 1;
    }

    function hasValidMoves() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // 尝试右交换
                if (c < COLS - 1) {
                    swap(r, c, r, c+1);
                    if (findMatches().size > 0) { swap(r, c, r, c+1); return true; }
                    swap(r, c, r, c+1);
                }
                // 尝试下交换
                if (r < ROWS - 1) {
                    swap(r, c, r+1, c);
                    if (findMatches().size > 0) { swap(r, c, r+1, c); return true; }
                    swap(r, c, r+1, c);
                }
            }
        }
        return false;
    }

    // ========== 渲染 ==========
    function renderBoard(dropInfo) {
        const boardEl = document.getElementById('board');
        const cellSize = Math.floor((boardEl.parentElement.clientWidth - 12 - (COLS-1)*3) / COLS);
        boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
        boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
        boardEl.innerHTML = '';

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;

                if (board[r][c] >= 0) {
                    cell.classList.add(`gem-${board[r][c]}`);
                    const icon = document.createElement('span');
                    icon.className = 'gem-icon';
                    icon.textContent = GEM_ICONS[board[r][c]];
                    cell.appendChild(icon);
                }

                if (selected && selected.r === r && selected.c === c) {
                    cell.classList.add('selected');
                }

                // 下落动画
                if (dropInfo) {
                    for (const d of dropInfo) {
                        if (d.c === c && d.toR === r) {
                            cell.classList.add('dropping');
                            break;
                        }
                    }
                }

                cell.addEventListener('click', () => onCellClick(r, c));
                // 触摸滑动
                cell.addEventListener('touchstart', (e) => onTouchStart(e, r, c), {passive: false});
                cell.addEventListener('touchend', (e) => onTouchEnd(e, r, c), {passive: false});

                boardEl.appendChild(cell);
            }
        }
    }

    function updateUI() {
        const cfg = LEVELS[level];
        document.getElementById('levelNum').textContent = level + 1;
        document.getElementById('scoreNum').textContent = score;
        document.getElementById('movesNum').textContent = moves;
        document.getElementById('comboNum').textContent = combo;
        document.getElementById('targetLabel').textContent = `目标: ${cfg.target}`;
        const pct = Math.min(100, Math.round(score / cfg.target * 100));
        document.getElementById('targetPct').textContent = pct + '%';
        document.getElementById('targetFill').style.width = pct + '%';
    }

    // ========== 交互 ==========
    let touchStart = null;

    function onTouchStart(e, r, c) {
        if (animating) return;
        touchStart = { r, c, x: e.touches[0].clientX, y: e.touches[0].clientY };
    }

    function onTouchEnd(e, r, c) {
        if (animating || !touchStart) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist > 20) {
            // 滑动操作
            let tr = r, tc = c;
            if (Math.abs(dx) > Math.abs(dy)) {
                tc += dx > 0 ? 1 : -1;
            } else {
                tr += dy > 0 ? 1 : -1;
            }
            if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
                trySwap(r, c, tr, tc);
            }
            selected = null;
        } else {
            // 点击操作
            onCellClick(r, c);
        }
        touchStart = null;
    }

    function onCellClick(r, c) {
        if (animating) return;
        if (!selected) {
            selected = { r, c };
            renderBoard();
        } else if (selected.r === r && selected.c === c) {
            selected = null;
            renderBoard();
        } else if (isAdjacent(selected.r, selected.c, r, c)) {
            trySwap(selected.r, selected.c, r, c);
            selected = null;
        } else {
            selected = { r, c };
            renderBoard();
        }
    }

    async function trySwap(r1, c1, r2, c2) {
        if (animating) return;
        animating = true;

        swap(r1, c1, r2, c2);
        const matched = findMatches();

        if (matched.size === 0) {
            // 无效交换，换回
            swap(r1, c1, r2, c2);
            renderBoard();
            // 抖动效果
            const cells = document.querySelectorAll('.cell');
            const idx1 = r1 * COLS + c1, idx2 = r2 * COLS + c2;
            if (cells[idx1]) { cells[idx1].style.animation = 'none'; cells[idx1].offsetHeight; cells[idx1].style.animation = ''; }
            if (cells[idx2]) { cells[idx2].style.animation = 'none'; cells[idx2].offsetHeight; cells[idx2].style.animation = ''; }
            animating = false;
            return;
        }

        // 消耗步数
        moves--;
        combo = 0;
        renderBoard();
        await sleep(150);

        // 连锁消除
        await processMatches();

        animating = false;
        saveGame();
        checkGameState();
    }

    async function processMatches() {
        let matched = findMatches();
        while (matched.size > 0) {
            combo++;
            const pts = matched.size * 10 * combo;
            score += pts;

            // 消除动画
            const cells = document.querySelectorAll('.cell');
            matched.forEach(idx => {
                if (cells[idx]) {
                    cells[idx].classList.add('removing');
                    spawnParticles(cells[idx], board[Math.floor(idx/COLS)][idx%COLS]);
                }
            });

            // 连击文字
            if (combo > 1) showCombo(combo);

            await sleep(350);
            removeMatches(matched);
            const drops = dropGems();
            renderBoard(drops);
            updateUI();
            await sleep(300);

            matched = findMatches();
        }
    }

    function checkGameState() {
        const cfg = LEVELS[level];
        if (score >= cfg.target) {
            // 过关
            if (level + 1 < LEVELS.length) {
                maxLevel = Math.max(maxLevel, level + 2);
                localStorage.setItem('match3_max', String(maxLevel));
            }
            clearSave();
            showOverlay('过关！', `第 ${level+1} 关完成`, score, true);
        } else if (moves <= 0) {
            clearSave();
            showOverlay('步数用完', `差 ${cfg.target - score} 分未达标`, score, false);
        } else if (!hasValidMoves()) {
            // 死局，自动洗牌
            shuffleBoard();
        }
    }

    // ========== 特效 ==========
    function spawnParticles(cell, gemType) {
        const rect = cell.getBoundingClientRect();
        const color = GEM_COLORS[gemType] || '#fff';
        for (let i = 0; i < 6; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.background = color;
            p.style.left = (rect.left + rect.width/2) + 'px';
            p.style.top = (rect.top + rect.height/2) + 'px';
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 40;
            p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
            p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }
    }

    function showCombo(n) {
        const el = document.createElement('div');
        el.className = 'combo-text';
        el.textContent = `${n}连击!`;
        el.style.left = '50%';
        el.style.top = '40%';
        el.style.transform = 'translateX(-50%)';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function showOverlay(title, text, scoreVal, isWin) {
        let html = `<div class="overlay-title">${title}</div>`;
        html += `<div class="overlay-text">${text}</div>`;
        html += `<div class="overlay-score">${scoreVal}</div>`;
        if (isWin && level + 1 < LEVELS.length) {
            html += `<button class="overlay-btn overlay-btn-primary" onclick="nextLevel()">下一关</button>`;
        }
        html += `<button class="overlay-btn overlay-btn-primary" onclick="restartLevel()">重玩</button>`;
        html += `<button class="overlay-btn overlay-btn-primary" onclick="showLevelSelect()">选关</button>`;

        let overlay = document.getElementById('overlay');
        if (!overlay) { overlay = document.createElement('div'); overlay.id = 'overlay'; overlay.className = 'overlay'; document.body.appendChild(overlay); }
        overlay.innerHTML = `<div class="overlay-box">${html}</div>`;
        overlay.style.display = 'flex';
    }

    function hideOverlay() {
        const o = document.getElementById('overlay');
        if (o) o.style.display = 'none';
    }

    // ========== 本地存储 ==========
    function saveGame() {
        const data = {
            level, score, moves, combo, board,
            maxLevel, timestamp: Date.now()
        };
        localStorage.setItem('match3_save', JSON.stringify(data));
    }

    function loadGame() {
        try {
            const raw = localStorage.getItem('match3_save');
            if (!raw) return null;
            const data = JSON.parse(raw);
            // 校验数据完整性
            if (data && typeof data.level === 'number' && data.board && data.board.length === ROWS) {
                return data;
            }
        } catch (e) {}
        return null;
    }

    function clearSave() {
        localStorage.removeItem('match3_save');
    }

    // ========== 关卡管理 ==========
    function startLevel(lv) {
        hideOverlay();
        level = lv;
        score = 0;
        combo = 0;
        selected = null;
        animating = false;
        const cfg = LEVELS[lv];
        moves = cfg.moves;
        initBoard();
        // 确保初始有可走步
        while (!hasValidMoves()) initBoard();
        renderBoard();
        updateUI();
        saveGame();
    }

    function resumeGame(data) {
        hideOverlay();
        level = data.level;
        score = data.score;
        moves = data.moves;
        combo = data.combo || 0;
        board = data.board;
        maxLevel = Math.max(maxLevel, data.maxLevel || 1);
        selected = null;
        animating = false;
        renderBoard();
        updateUI();
    }

    function nextLevel() {
        if (level + 1 < LEVELS.length) startLevel(level + 1);
    }

    function restartLevel() {
        startLevel(level);
    }

    function shuffleBoard() {
        if (animating) return;
        // 测试模式下洗牌扣1步
        if (testMode) {
            moves--;
            updateUI();
            if (moves <= 0) {
                const cfg = LEVELS[level];
                clearSave();
                showOverlay('步数用完', `差 ${cfg.target - score} 分未达标`, score, false);
                return;
            }
        }
        // Fisher-Yates 洗牌
        const flat = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) flat.push(board[r][c]);
        for (let i = flat.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flat[i], flat[j]] = [flat[j], flat[i]];
        }
        let idx = 0;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) board[r][c] = flat[idx++];
        // 如果洗牌后立即有匹配或无可走步，重新初始化
        if (findMatches().size > 0 || !hasValidMoves()) {
            initBoard();
            while (!hasValidMoves()) initBoard();
        }
        selected = null;
        renderBoard();
    }

    function showLevelSelect() {
        hideOverlay();
        let html = `<div class="overlay-title">选择关卡</div>`;
        html += `<div class="level-select">`;
        for (let i = 0; i < LEVELS.length; i++) {
            const locked = i + 1 > maxLevel;
            const current = i === level;
            html += `<button class="level-btn${locked?' locked':''}${current?' current':''}" ${locked?'disabled':''} onclick="startLevel(${i})">${i+1}</button>`;
        }
        html += `</div>`;
        html += `<button class="overlay-btn overlay-btn-primary" onclick="startLevel(${level})">返回</button>`;

        let overlay = document.getElementById('overlay');
        if (!overlay) { overlay = document.createElement('div'); overlay.id = 'overlay'; overlay.className = 'overlay'; document.body.appendChild(overlay); }
        overlay.innerHTML = `<div class="overlay-box">${html}</div>`;
        overlay.style.display = 'flex';
    }

    // ========== 测试码 ==========
    let testCodeStr = '';
    const TEST_CODE = '1122112211';

    function toggleTestCode() {
        const area = document.getElementById('testCodeArea');
        area.style.display = area.style.display === 'none' ? 'block' : 'none';
    }

    function appendTestDigit(d) {
        if (testCodeStr.length < 10) {
            testCodeStr += d;
            document.getElementById('testCodeInput').textContent = testCodeStr;
        }
    }

    function appendTestBackspace() {
        testCodeStr = testCodeStr.slice(0, -1);
        document.getElementById('testCodeInput').textContent = testCodeStr;
    }

    function submitTestCode() {
        if (testCodeStr === TEST_CODE) {
            testMode = true;
            maxLevel = LEVELS.length;
            localStorage.setItem('match3_max', String(maxLevel));
            document.getElementById('testCodeArea').style.display = 'none';
            // 显示测试模式标识
            const badge = document.createElement('div');
            badge.id = 'testBadge';
            badge.style.cssText = 'position:absolute;top:8px;left:8px;background:rgba(255,0,0,0.2);border:1px solid rgba(255,0,0,0.4);border-radius:6px;padding:2px 8px;font-size:10px;color:#ff6464;z-index:10;letter-spacing:1px;';
            badge.textContent = 'TEST';
            document.getElementById('gameWrap').appendChild(badge);
            // 提示
            showLevelSelect();
        } else {
            testCodeStr = '';
            document.getElementById('testCodeInput').textContent = '';
            document.getElementById('testCodeInput').style.borderColor = 'rgba(255,100,100,0.5)';
            setTimeout(() => {
                document.getElementById('testCodeInput').style.borderColor = 'rgba(255,180,255,0.2)';
            }, 500);
        }
    }

    // ========== 工具 ==========
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ========== 初始化 ==========
    (function init() {
        const saved = loadGame();
        if (saved) {
            resumeGame(saved);
        } else {
            startLevel(0);
        }
        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    })();
    </script>
</body>
</html>
